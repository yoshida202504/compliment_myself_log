services:
  app:
    build: ./docker/php
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laraveldb
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - db-data:/var/lib/mysql
  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8089:8080"
volumes:
  db-data: